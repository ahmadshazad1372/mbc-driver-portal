<style>
  :root{
    --bg1:#0E1315; --bg2:#1A2325;
    --glass: rgba(255,255,255,0.045);
    --glass-brd: rgba(255,255,255,0.10);
    --accent:#2DD4BF; --accent-soft: rgba(45,212,191,0.16);
    --text:#E7F3F1; --muted:#7E9490; --danger:#FF7A7A; --ok:#2DD4BF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% -10%, #17302d 0%, var(--bg1) 45%, var(--bg2) 100%);
    font-family:'Inter',sans-serif; color:var(--text); padding:24px 12px;
  }
  h1, .card-title{ font-family:'Space Grotesk', sans-serif; }
  .routeline{
    height:26px; margin:0 0 -6px; position:relative; z-index:2;
    background-image: repeating-linear-gradient(90deg, var(--accent) 0 10px, transparent 10px 20px);
    background-size: 20px 2px; background-repeat:no-repeat; background-position: 26px 13px;
    opacity:.55;
  }
  .routeline::before, .routeline::after{
    content:""; position:absolute; top:6px; width:8px; height:8px; border-radius:50%; background:var(--accent);
  }
  .routeline::before{ left:20px; } .routeline::after{ right:20px; }
  .phone{
    width:390px; max-width:100%; border-radius:34px; padding:6px;
    background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .screen{
    border-radius:30px; overflow:hidden; min-height:720px;
    background: var(--glass);
    backdrop-filter: blur(34px) saturate(170%);
    -webkit-backdrop-filter: blur(34px) saturate(170%);
    border:1px solid var(--glass-brd);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 60px rgba(255,255,255,0.02);
    display:flex; flex-direction:column;
    position:relative;
  }
  .screen::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(500px 200px at 80% -10%, var(--accent-soft), transparent 60%);
  }
  .langbar{
    display:flex; gap:6px; padding:16px 16px 0; position:relative; z-index:2; flex-wrap:wrap;
  }
  .lang-btn{
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600; letter-spacing:.2px;
    padding:6px 12px; border-radius:999px; border:1px solid var(--glass-brd);
    background:rgba(255,255,255,0.04); color:var(--muted); cursor:pointer;
  }
  .lang-btn.active{ background:var(--accent); color:#0C1220; border-color:var(--accent); }

  .content{ padding:28px 26px 20px; position:relative; z-index:2; flex:1; display:flex; flex-direction:column; }
  .brandrow{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .logo{
    width:44px; height:44px; border-radius:13px; flex:none;
    background: linear-gradient(135deg, var(--accent), #1B8F80);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; color:#052620;
    box-shadow: 0 8px 20px -6px rgba(45,212,191,0.5);
  }
  h1{ font-size:19px; margin:0; font-weight:700; letter-spacing:.1px; }
  .tagline{ margin:2px 0 0; font-size:12.5px; color:var(--muted); line-height:1.4; }

  .card-title{ font-size:15px; font-weight:700; margin:0 0 4px; }
  .card-sub{ font-size:12.5px; color:var(--muted); margin:0 0 22px; line-height:1.5; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; }
  .field input{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--glass-brd);
    background:rgba(255,255,255,0.05); color:var(--text); font-size:14px; font-family:inherit;
    outline:none; transition:border-color .15s;
  }
  .field input:focus{ border-color:var(--accent); background:rgba(255,255,255,0.08); }
  .field input::placeholder{ color:#6B7994; }

  .primary-btn{
    width:100%; padding:14px; border:none; border-radius:12px; margin-top:6px;
    background:linear-gradient(135deg, var(--accent), #1B8F80); color:#052620;
    font-size:14.5px; font-weight:700; cursor:pointer; letter-spacing:.2px;
    box-shadow: 0 10px 24px -8px rgba(45,212,191,0.45);
  }
  .primary-btn:active{ transform: translateY(1px); }

  .hint{ font-size:11.5px; color:var(--muted); margin-top:14px; line-height:1.6; text-align:center; }
  .err{ font-size:12px; color:var(--danger); margin-top:10px; display:none; font-weight:600; }

  .photo-wrap{ display:flex; flex-direction:column; align-items:center; margin-bottom:22px; }
  .photo-circle{
    width:88px; height:88px; border-radius:50%; border:1.5px dashed var(--glass-brd);
    background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center;
    font-size:26px; color:var(--muted); cursor:pointer; margin-bottom:8px;
  }
  .photo-cap{ font-size:11.5px; color:var(--muted); }

  .id-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
    background:var(--accent-soft); color:var(--accent); padding:5px 10px; border-radius:999px; margin-bottom:18px;
    width:fit-content;
  }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .icon-btn{
    display:flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    background:rgba(255,255,255,0.05); border:1px solid var(--glass-brd); color:var(--muted);
    padding:7px 12px; border-radius:999px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .icon-btn:active{ transform: translateY(1px); }
  .icon-btn.exit-btn{ color:var(--danger); border-color:rgba(255,122,122,0.3); background:rgba(255,122,122,0.08); }

  @keyframes readyPulse{
    0%,100%{ box-shadow: 0 10px 24px -8px rgba(45,212,191,0.45), 0 0 0 0 rgba(45,212,191,0.5); }
    50%{ box-shadow: 0 10px 30px -6px rgba(45,212,191,0.7), 0 0 0 8px rgba(45,212,191,0); }
  }
  .primary-btn.ready{ animation: readyPulse 1.4s ease-in-out infinite; }

  .photo-row{ display:flex; gap:10px; justify-content:center; margin-bottom:8px; }
  .photo-slot{
    width:72px; height:72px; border-radius:20px; border:1.5px dashed var(--glass-brd);
    background:rgba(255,255,255,0.05); background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; color:var(--muted); cursor:pointer; flex:none;
  }
  .photo-wrap{ display:flex; flex-direction:column; align-items:center; margin-bottom:22px; }

  .success-wrap{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:30px 6px; }
  .success-check{
    width:74px; height:74px; border-radius:50%; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; font-size:34px; color:var(--ok);
    margin-bottom:18px; border:1.5px solid var(--accent);
  }
  .success-title{ font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; margin:0 0 8px; }
  .success-sub{ font-size:12.5px; color:var(--muted); line-height:1.6; margin:0 0 26px; max-width:280px; }

  footer{ text-align:center; font-size:10.5px; color:#5C6780; padding:14px 0 20px; position:relative; z-index:2; }

  [dir="rtl"] .field label{ text-align:right; }
  [dir="rtl"] .brandrow{ flex-direction:row-reverse; }
  [dir="rtl"] .id-chip{ flex-direction:row-reverse; }
  .rtl-font{ font-family:'Noto Naskh Arabic','Noto Nastaliq Urdu',serif; }

  .hidden{ display:none !important; }
</style>
</head>

    </div>
  </div>

  <footer id="footerNote">Modern Bus Company · Makkah</footer>
</div></div>

    osc.frequency.value = 720;
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.09);
  }catch(e){}
}
document.addEventListener('click', function(e){
  if(e.target.closest('button')) playClick();
});

function buildLangBar(){
  const bar=document.getElementById('langbar'); bar.innerHTML='';
  LANGS.forEach(l=>{
    const b=document.createElement('button');
    b.className='lang-btn'+(l.code===currentLang?' active':'');
    b.textContent=l.label;
    b.onclick=()=>setLang(l.code);
    bar.appendChild(b);
  });
}
function setLang(code){
  currentLang=code;
  const t=T[code]; const rtl = LANGS.find(l=>l.code===code).rtl;
  const screen=document.getElementById('screen');
  screen.dir = rtl?'rtl':'ltr';
  screen.classList.toggle('rtl-font', rtl);
  document.getElementById('appName').textContent=t.appName;
  document.getElementById('tagline').textContent=t.tagline;
  document.getElementById('loginTitle').textContent=t.loginTitle;
  document.getElementById('lblEmpId').textContent=t.empId;
  document.getElementById('empId').placeholder=t.empIdPh;
  document.getElementById('lblEmpIdConfirm').textContent=t.empIdConfirm;
  document.getElementById('empIdConfirm').placeholder=t.empIdPh;
  document.getElementById('loginBtn').textContent=t.loginBtn;
  document.getElementById('loginHint').textContent=t.loginHint;
  document.getElementById('photoLabel').textContent=t.photoLabel;
  document.getElementById('lblEmail').textContent=t.email;
  document.getElementById('lblEmailConfirm').textContent=t.emailConfirm;
  document.getElementById('lblMobile').textContent=t.mobile;
  document.getElementById('lblMobileConfirm').textContent=t.mobileConfirm;
  document.getElementById('submitBtn').textContent=t.submit;
  document.getElementById('footerNote').textContent=t.footer;
  const idVal=document.getElementById('empId').value.trim();
  document.getElementById('step2Sub').textContent=t.step2Sub.replace('{id}', idVal||'—');
  document.getElementById('welcomeTitle').textContent=t.welcomeDear.replace('{name}', currentDriverName);
  document.getElementById('idChipText').textContent=idVal;
  document.getElementById('backLabel').textContent=t.backLabel;
  document.getElementById('exitLabel').textContent=t.exitLabel;
  document.getElementById('exitLabel2').textContent=t.exitLabel;
  document.getElementById('successTitle').textContent=t.successTitle;
  document.getElementById('successSub').textContent=t.successSub;
  buildLangBar();
}
function onPhotoChosen(ev, idx){
  const file = ev.target.files[0];
  if(!file) return;
  photosMime[idx] = file.type;
  const reader = new FileReader();
  reader.onload = function(e){
    photosBase64[idx] = e.target.result;
    const slot = document.getElementById('photoSlot'+idx);
    slot.style.backgroundImage = `url(${photosBase64[idx]})`;
    slot.textContent = '';
  };
  reader.readAsDataURL(file);
}
function normalizeDigits(v){ return (v||'').replace(/\D/g,''); }
function checkReady(){
  const t=T[currentLang];
  const email=document.getElementById('emailInput').value.trim();
  const email2=document.getElementById('emailConfirmInput').value.trim();
  const mobile=document.getElementById('mobileInput').value.trim();
  const mobile2=document.getElementById('mobileConfirmInput').value.trim();
  const digits=normalizeDigits(mobile);
  const ok = email && email2 && email===email2 && mobile && mobile2 && mobile===mobile2 && digits.length>=MIN_MOBILE_DIGITS;
  document.getElementById('submitBtn').classList.toggle('ready', !!ok);
}
['emailInput','emailConfirmInput','mobileInput','mobileConfirmInput'].forEach(id=>{
  document.getElementById(id).addEventListener('input', checkReady);
});
function resetApp(){
  document.getElementById('registerView').classList.add('hidden');
  document.getElementById('successView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('empId').value='';
  document.getElementById('empIdConfirm').value='';
  document.getElementById('emailInput').value='';
  document.getElementById('emailConfirmInput').value='';
  document.getElementById('mobileInput').value='';
  document.getElementById('mobileConfirmInput').value='';
  photosBase64=[null,null,null]; photosMime=[null,null,null];
  [0,1,2].forEach(i=>{
    const slot=document.getElementById('photoSlot'+i);
    slot.style.backgroundImage=''; slot.textContent='📷';
  });
  document.getElementById('errMsg').style.display='none';
  document.getElementById('regErrMsg').style.display='none';
  document.getElementById('submitBtn').classList.remove('ready');
  currentDriverName='';
}
async function tryLogin(){
  const t=T[currentLang];
  const id=document.getElementById('empId').value.trim();
  const id2=document.getElementById('empIdConfirm').value.trim();
  const errEl=document.getElementById('errMsg');
  const btn=document.getElementById('loginBtn');
  if(id!==id2){ errEl.style.color='var(--danger)'; errEl.textContent=t.errMismatch; errEl.style.display='block'; return; }
  if(!id){ return; }
  const originalLabel=btn.textContent;
  btn.textContent='...'; btn.disabled=true;
  try{
    const res = await fetch(`${API_URL}?action=checkId&id=${encodeURIComponent(id)}`);
    const data = await res.json();
    if(!data.found){
      errEl.style.color='var(--danger)'; errEl.textContent=t.errNotFound; errEl.style.display='block';
      return;
    }
    errEl.style.display='none';
    currentDriverName = data.name;
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('registerView').classList.remove('hidden');
    document.getElementById('idChipText').textContent=id;
    document.getElementById('step2Sub').textContent=t.step2Sub.replace('{id}', id);
    document.getElementById('welcomeTitle').textContent=t.welcomeDear.replace('{name}', currentDriverName);
  }catch(err){
    errEl.style.color='var(--danger)'; errEl.textContent=t.errNotFound; errEl.style.display='block';
  }finally{
    btn.textContent=originalLabel; btn.disabled=false;
  }
}
async function trySubmit(){
  const t=T[currentLang];
  const id=document.getElementById('empId').value.trim();
  const email=document.getElementById('emailInput').value.trim();
  const email2=document.getElementById('emailConfirmInput').value.trim();
  const mobile=document.getElementById('mobileInput').value.trim();
  const mobile2=document.getElementById('mobileConfirmInput').value.trim();
  const errEl=document.getElementById('regErrMsg');
  const btn=document.getElementById('submitBtn');
  if(email!==email2){ errEl.style.color='var(--danger)'; errEl.textContent=t.errEmailMismatch; errEl.style.display='block'; return; }
  if(mobile!==mobile2){ errEl.style.color='var(--danger)'; errEl.textContent=t.errMobileMismatch; errEl.style.display='block'; return; }
  if(normalizeDigits(mobile).length<MIN_MOBILE_DIGITS){ errEl.style.color='var(--danger)'; errEl.textContent=t.errMobileLength; errEl.style.display='block'; return; }
  const originalLabel=btn.textContent;
  btn.textContent='...'; btn.disabled=true;
  const photos = photosBase64.map((b,i)=> b ? {data:b, mime:photosMime[i]} : null).filter(Boolean);
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'submit', id, email, mobile, photos })
    });
    const data = await res.json();
    if(data.success){
      document.getElementById('registerView').classList.add('hidden');
      document.getElementById('successView').classList.remove('hidden');
    }else{
      errEl.style.color='var(--danger)'; errEl.textContent=t.errNotFound; errEl.style.display='block';
    }
  }catch(err){
    errEl.style.color='var(--danger)'; errEl.textContent=t.errNotFound; errEl.style.display='block';
  }finally{
    btn.textContent=originalLabel; btn.disabled=false;
  }
}
buildLangBar(); setLang('en');
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
